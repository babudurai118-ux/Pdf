<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock the Download</title>
<style>
  :root{
    --bg:#14161c; --panel:#1d2029; --text:#f2efe9; --muted:#9aa0ae;
    --red:#c8283a; --gold:#e6b34a; --ok:#3fbf7f; --bad:#ff5d6f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:460px; background:var(--panel);
    border:2px solid var(--gold); border-radius:6px; padding:32px 26px;
    box-shadow:8px 8px 0 var(--red); text-align:left;
  }
  .page{display:none}
  .page.active{display:block}
  h1{font-size:1.9rem;margin:0 0 10px;line-height:1.15;color:var(--gold)}
  h2{font-size:1.25rem;margin:0 0 6px;line-height:1.3}
  p{color:var(--muted);margin:0 0 20px;line-height:1.5}
  input{
    width:100%; padding:13px; font-size:1rem; border-radius:4px;
    border:2px solid #3a3f4d; background:#12141a; color:var(--text);
    margin-bottom:14px;
  }
  input:focus{outline:3px solid var(--gold);outline-offset:1px}
  button{
    width:100%; padding:14px; font-size:1.05rem; font-weight:700;
    background:var(--red); color:#fff; border:0; border-radius:4px; cursor:pointer;
  }
  button:hover{background:#dd3347}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .step{color:var(--muted);font-size:.9rem;margin-bottom:14px}
  .result{text-align:center}
  .result .icon{
    width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-size:2.6rem;font-weight:700;color:#fff;
  }
  .result.good h1{color:var(--ok)}
  .result.good .icon{background:var(--ok)}
  .result.bad h1{color:var(--bad)}
  .result.bad .icon{background:var(--bad)}
  .result.good button{background:var(--ok);color:#0e1a14}
  .result.good button:hover{background:#55d595}
</style>
</head>
<body>
<main class="card">

  <!-- Home -->
  <section id="home" class="page active">
    <h1>Start download</h1>
    <p>Answer ten Marvel questions to unlock your file.</p>
    <button id="startBtn">Start</button>
  </section>

  <!-- Question (reused for every question) -->
  <section id="quiz" class="page">
    <div class="step" id="step"></div>
    <h2 id="qText"></h2>
    <p id="qHint"></p>
    <input id="answer" type="text" placeholder="Your answer" autocomplete="off">
    <button id="checkBtn">Check answer</button>
  </section>

  <!-- Correct -->
  <section id="good" class="page result good">
    <div class="icon">&#10003;</div>
    <h1>Correct!</h1>
    <p id="goodText"></p>
    <button id="nextBtn">Next question</button>
  </section>

  <!-- Wrong -->
  <section id="bad" class="page result bad">
    <div class="icon">&#10007;</div>
    <h1>Wrong answer</h1>
    <p>That's not it. Give it another try.</p>
    <button id="retryBtn">Try again</button>
  </section>

  <!-- Done -->
  <section id="done" class="page">
    <h1>Unlocked!</h1>
    <p>All ten answers are correct. Your download is starting.</p>
    <button id="again">Download again</button>
  </section>

</main>

<script>
  // GitHub "blob" link converted to a direct "raw" link
  const FILE_URL = "https://github.com/babudurai118-ux/Pdf/raw/26e2ff5844e5429f4a8cb24cdcb300fcade18e96/DocScanner%20Oct%205%2C%202026%207-01%20PM.pdf";
  const FILE_NAME = "DocScanner Oct 5, 2026 7-01 PM.pdf";

  const QUESTIONS = [
    {
      q: "What's the greatest dialogue of Iron Man?",
      hint: "Type it as you remember it.",
      // approximate match: 70% of the words must be present
      approx: [
        "No amount of money I spent ever bought me a single second",
        "No amount of money ever bought a second of time"
      ]
    },
    {
      q: "What's Durai Babu's favourite Marvel character?",
      hint: "",
      exact: ["spiderman"]
    },
    {
      q: "What is the name of Thor's hammer?",
      hint: "",
      exact: ["mjolnir", "mjollnir"]
    },
    {
      q: "Which metal is Captain America's shield made of?",
      hint: "",
      exact: ["vibranium"]
    },
    {
      q: "What is the name of Tony Stark's first AI assistant?",
      hint: "",
      exact: ["jarvis"]
    },
    {
      q: "Who is Thor's adopted brother?",
      hint: "",
      exact: ["loki"]
    },
    {
      q: "Which Infinity Stone is in Vision's forehead?",
      hint: "",
      exact: ["mind", "mindstone", "themindstone"]
    },
    {
      q: "What is the name of Black Panther's home country?",
      hint: "",
      exact: ["wakanda"]
    },
    {
      q: "What is the Hulk's human name?",
      hint: "",
      exact: ["brucebanner", "bruce", "banner"]
    },
    {
      q: "Which villain snaps his fingers in Infinity War?",
      hint: "",
      exact: ["thanos"]
    }
  ];
  const THRESHOLD = 0.7;

  const $ = id => document.getElementById(id);
  let current = 0;

  function show(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $(id).classList.add("active");
  }

  const words = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
  const squash = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");

  function approxMatch(input, target) {
    const t = words(target), u = new Set(words(input));
    if (!u.size) return false;
    return t.filter(w => u.has(w)).length / t.length >= THRESHOLD;
  }

  function isCorrect(q, value) {
    if (q.approx) return q.approx.some(t => approxMatch(value, t));
    return q.exact.includes(squash(value));
  }

  function showQuestion() {
    const q = QUESTIONS[current];
    $("step").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
    $("qText").textContent = q.q;
    $("qHint").textContent = q.hint;
    $("qHint").style.display = q.hint ? "block" : "none";
    $("answer").value = "";
    show("quiz");
    $("answer").focus();
  }

  async function startDownload() {
    try {
      const res = await fetch(FILE_URL);
      if (!res.ok) throw new Error("bad response");
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = FILE_NAME;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) {
      window.location.href = FILE_URL; // fallback
    }
  }

  function check() {
    if (isCorrect(QUESTIONS[current], $("answer").value)) {
      const last = current === QUESTIONS.length - 1;
      $("goodText").textContent = last
        ? "That was the last question."
        : "Question " + (current + 1) + " of " + QUESTIONS.length + " done.";
      $("nextBtn").textContent = last ? "Start download" : "Next question";
      show("good");
      $("nextBtn").focus();
    } else {
      show("bad");
      $("retryBtn").focus();
    }
  }

  $("startBtn").onclick = () => { current = 0; showQuestion(); };
  $("checkBtn").onclick = check;
  $("answer").addEventListener("keydown", e => e.key === "Enter" && check());
  $("retryBtn").onclick = showQuestion;
  $("nextBtn").onclick = () => {
    if (current === QUESTIONS.length - 1) {
      show("done");
      startDownload();
    } else {
      current++;
      showQuestion();
    }
  };
  $("again").onclick = startDownload;
</script>
</body>
</html>
